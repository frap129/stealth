name: Android APK

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build debug APK
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk stealth-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stealth-debug
          path: stealth-debug.apk
          if-no-files-found: error

  release:
    name: Build and publish release APK
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # CI signing key (separate from F-Droid). Configure these repository secrets:
      #   ANDROID_KEYSTORE_BASE64  - base64-encoded .jks/.keystore file
      #   ANDROID_KEY_ALIAS        - key alias
      #   ANDROID_KEY_PASSWORD     - key password
      #   ANDROID_STORE_PASSWORD   - keystore password
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Create keystore.properties
        run: |
          {
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "storeFile=../release.keystore"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk "stealth-${{ github.ref_name }}.apk"

      - name: Upload release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: stealth-${{ github.ref_name }}.apk
          generate_release_notes: true
